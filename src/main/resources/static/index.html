<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Weather Enricher</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h1 class="mb-4">Weather Enricher</h1>

    <div class="row">
      <div class="col-md-6">
        <div class="card mb-4">
          <div class="card-body">
            <form id="enrichForm">
              <div class="mb-3">
                <label for="location" class="form-label">Location</label>
                <input type="text" id="location" class="form-control" placeholder="e.g. London" required>
              </div>
              <button class="btn btn-primary" type="submit">Fetch & Save</button>
            </form>
            <div id="status" class="mt-3"></div>
          </div>
        </div>

        <h2>Saved Records</h2>
        <div id="records" class="mt-3"></div>
      </div>

      <div class="col-md-6">
        <h2>Records (sorted by temperature desc)</h2>
        <div id="sortedRecords" class="mt-3"></div>
      </div>
    </div>
  </div>

<script>
async function postEnrich(location) {
  const res = await fetch('/api/enrich', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ location })
  });
  if (!res.ok) throw res;
  return await res.json();
}

async function loadRecords() {
  const res = await fetch('/api/enriched');
  if (!res.ok) return [];
  return await res.json();
}

async function loadSortedRecords() {
  const res = await fetch('/api/enriched/sorted');
  if (!res.ok) return [];
  return await res.json();
}

function renderRecord(r) {
  return `<div class="card mb-2">
    <div class="card-body">
      <h5 class="card-title">${r.location} <small class="text-muted">(${r.latitude}, ${r.longitude})</small></h5>
      <p class="card-text">Temp: ${r.temperature} °C — Wind: ${r.windspeed} m/s @ ${r.winddirection}° — Code: ${r.weatherCode}</p>
      <small class="text-muted">Saved: ${r.processedAt}</small>
    </div>
  </div>`;
}

function renderSortedRecord(r, idx) {
  return `<div class="d-flex align-items-start mb-2">
    <div class="me-3 fw-bold">#${idx + 1}</div>
    <div class="flex-grow-1">
      <div><strong>${r.location}</strong> <small class="text-muted">(${r.latitude}, ${r.longitude})</small></div>
      <div>Temp: ${r.temperature} °C — Wind: ${r.windspeed} m/s</div>
      <small class="text-muted">Saved: ${r.processedAt}</small>
    </div>
  </div>`;
}

async function refresh() {
  const [records, sorted] = await Promise.all([loadRecords(), loadSortedRecords()]);

  const el = document.getElementById('records');
  if (!records.length) el.innerHTML = '<div class="alert alert-info">No records yet.</div>';
  else el.innerHTML = records.map(renderRecord).join('');

  const sel = document.getElementById('sortedRecords');
  if (!sorted.length) sel.innerHTML = '<div class="alert alert-info">No records yet.</div>';
  else sel.innerHTML = sorted.map((r,i) => renderSortedRecord(r,i)).join('');
}

document.getElementById('enrichForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const loc = document.getElementById('location').value.trim();
  if (!loc) return;
  const status = document.getElementById('status');
  status.innerHTML = 'Processing...';
  try {
    const saved = await postEnrich(loc);
    status.innerHTML = `<div class="alert alert-success">Saved for ${saved.location} at ${saved.processedAt}</div>`;
    document.getElementById('location').value = '';
    await refresh();
  } catch (err) {
    let msg = 'Request failed';
    if (err.json) {
      const body = await err.json().catch(() => null);
      if (body && body.message) msg = body.message;
    }
    status.innerHTML = `<div class="alert alert-danger">${msg}</div>`;
  }
});

// initial load
refresh();
</script>
</body>
</html>
